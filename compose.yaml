services:
  controller:
    build: .
    image: sip-voice-home-control:local
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - controller-data:/data
    healthcheck:
      test: [CMD, voice-home, health]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  controller-data:
