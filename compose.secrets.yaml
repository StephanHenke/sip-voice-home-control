# Use: docker compose -f compose.yaml -f compose.secrets.yaml up -d
# Both files must exist; omit the optional openhab_token entries if unused.
services:
  controller:
    secrets:
      - sip_password
      - openhab_token
secrets:
  sip_password:
    file: ./secrets/sip_password
  openhab_token:
    file: ./secrets/openhab_token
