[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sip-voice-home-control"
version = "0.1.0"
description = "Local CPU voice control for FRITZ!Box SIP calls and openHAB"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2", "httpx==0.28.1", "phonenumbers==9.0.16"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
voice = ["vosk==0.3.45", "piper-tts==1.3.0"]

[project.scripts]
voice-home = "voice_home.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_home = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
