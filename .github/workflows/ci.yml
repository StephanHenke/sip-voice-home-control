name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: voice-home --config config.example.yaml validate
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sip-voice-home-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native audio and offline speech
        run: docker run --rm --network none --read-only --tmpfs /tmp:size=128m --cpus 2 --memory 2g --entrypoint python sip-voice-home-control:ci /app/scripts/smoke_runtime.py
