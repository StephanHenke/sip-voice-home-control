name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: voice-home --config config.example.yaml validate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sip-voice-home-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native runtime imports
        run: docker run --rm --entrypoint python sip-voice-home-control:ci -c "import pjsua2, vosk, piper; import voice_home.sip"
